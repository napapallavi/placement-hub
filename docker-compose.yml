version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: placement_hub_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: placement_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placement_hub_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/placement_hub
      - SECRET_KEY=placement_hub_super_secret_jwt_key_2026_xyz987
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placement_hub_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
